apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-telemetry-and-metrics
  namespace: llm-d-observatory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: telemetry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 16686
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-observer-api
  namespace: llm-d-observatory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: observer-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: observatory-frontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
