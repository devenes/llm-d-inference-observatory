## Base values for llm-d-router-standalone v1.0.0 with OpenTelemetry tracing enabled.
router:
  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v1.0.0
    flags:
      v: 2
    pluginsConfigFile: "default-plugins.yaml"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http
    targetPorts:
      - number: 8000

  proxy:
    proxyType: envoy
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "2"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

  # Explicitly enable OpenTelemetry tracing on EPP (fixes Reference A's omitted enabled: true)
  tracing:
    enabled: true
    otelExporterEndpoint: "http://otel-collector.llm-d-observatory.svc.cluster.local:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "1.0"
