## Flow Control and Traffic Prioritization configuration for CPU inference (L07).
## Layer on top of: deploy/llm-d/base.values.yaml
## Enables the EPP flowControl feature gate with three priority bands:
## - priority 100 (premium-traffic): interactive / latency-sensitive requests
## - priority 0   (standard-traffic): default traffic band
## - priority -10 (best-effort-traffic): background / batch traffic with bounded queue capacity (maxRequests: 6)
## Calibrates concurrency-detector maxConcurrency=2 per CPU replica so saturation
## gating engages predictably during concurrent CPU bursts.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    flags:
      ha-enable-leader-election: false
      v: 2
    pluginsConfigFile: "flow-control-plugins.yaml"
    pluginsCustomConfig:
      flow-control-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        featureGates:
          - flowControl
        plugins:
          - type: token-producer
            parameters:
              modelName: Qwen/Qwen2.5-0.5B-Instruct
              vllm:
                endpointDiscovery:
                  attemptTimeout: 5s
                messagesRenderMode: auto
                responsesRenderMode: auto
          - type: endpoint-notification-source
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 64
                hashAlgorithm: xxh64
              speculativeIndexing: true
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: true
              kvEventsConfig:
                engineType: "vllm"
                topicFilter: "kv@"
                concurrency: 4
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
                  replaySocketPort: 5559
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
          - type: round-robin-fairness-policy
          - type: fcfs-ordering-policy
          - type: concurrency-detector
            parameters:
              maxConcurrency: 2
              concurrencyMode: requests
              headroom: 0.0

        dataLayer:
          sources:
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer

        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: queue-scorer
                weight: 2
              - pluginRef: kv-cache-utilization-scorer
                weight: 2
              - pluginRef: prefix-cache-scorer
                weight: 3

        flowControl:
          maxBytes: "1Gi"
          maxRequests: "100"
          defaultRequestTTL: "90s"
          saturationDetector:
            pluginRef: concurrency-detector
          priorityBands:
            - priority: 100
              maxRequests: "50"
              fairnessPolicyRef: round-robin-fairness-policy
              orderingPolicyRef: fcfs-ordering-policy
            - priority: 0
              maxRequests: "30"
              fairnessPolicyRef: round-robin-fairness-policy
              orderingPolicyRef: fcfs-ordering-policy
            - priority: -10
              maxRequests: "6"
              fairnessPolicyRef: round-robin-fairness-policy
              orderingPolicyRef: fcfs-ordering-policy

  modelServers:
    type: vllm
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
