## Flow-Control & Priority Band router configuration.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "flow-control-plugins.yaml"
    pluginsCustomConfig:
      flow-control-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        featureGates:
          - flowControl
        plugins:
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
          - type: metrics-data-source
            parameters:
              scheme: "http"
              path: "/metrics"
              insecureSkipVerify: true
          - type: core-metrics-extractor
          - name: max-Conc
            type: concurrency-detector
            parameters:
              maxConcurrency: 2
              concurrencyMode: requests
              headroom: 0.0
          - name: rr-fairness
            type: round-robin-fairness-policy
          - name: fcfs-ordering
            type: fcfs-ordering-policy
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: queue-scorer
                weight: 2
              - pluginRef: kv-cache-utilization-scorer
                weight: 2
              - pluginRef: prefix-cache-scorer
                weight: 3
         saturationDetector:
          pluginRef: max-Conc
        flowControl:
          maxBytes: "10485760"
          defaultRequestTTL: "60s"
          priorityBands:
            - priority: 100
              maxBytes: "5242880"
              maxRequests: "50"
              fairnessPolicyRef: rr-fairness
              orderingPolicyRef: fcfs-ordering
            - priority: 0
              maxBytes: "3145728"
              maxRequests: "30"
              fairnessPolicyRef: rr-fairness
              orderingPolicyRef: fcfs-ordering
            - priority: -10
              maxBytes: "524288"
              maxRequests: "6"
              fairnessPolicyRef: rr-fairness
              orderingPolicyRef: fcfs-ordering

  modelServers:
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
