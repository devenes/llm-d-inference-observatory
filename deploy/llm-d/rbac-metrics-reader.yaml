apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-d-observatory-metrics-reader
rules:
  - nonResourceURLs:
      - "/metrics"
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-d-observatory-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llm-d-observatory-metrics-reader
subjects:
  - kind: ServiceAccount
    name: llm-d-router-epp
    namespace: llm-d-observatory
  - kind: ServiceAccount
    name: observer-api
    namespace: llm-d-observatory
  - kind: ServiceAccount
    name: default
    namespace: llm-d-observatory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-d-observatory-epp-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: llm-d-router-epp
    namespace: llm-d-observatory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-observatory-pod-reader
  namespace: llm-d-observatory
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-observatory-pod-reader
  namespace: llm-d-observatory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-d-observatory-pod-reader
subjects:
  - kind: ServiceAccount
    name: observer-api
    namespace: llm-d-observatory
  - kind: ServiceAccount
    name: llm-d-router-epp
    namespace: llm-d-observatory
