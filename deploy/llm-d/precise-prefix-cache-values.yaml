## Precise Prefix-Cache Aware router configuration using ZMQ KV-Events (:5556 PUB / :5559 replay).
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "precise-prefix-cache-plugins.yaml"
    pluginsCustomConfig:
      precise-prefix-cache-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
          - type: endpoint-notification-source
          - type: precise-prefix-cache-producer
            parameters:
              indexerConfig:
                tokenProcessorConfig:
                  blockSizeTokens: 64
                  hashAlgorithm: "xxh64"
              kvEventsConfig:
                zmqEndpoint: "tcp://*:5556"
                topicFilter: "kv@"
                concurrency: 4
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
              speculativeIndexing: true
          - type: inflight-load-producer
          - type: prefix-cache-affinity-filter
            parameters:
              peakPrefillThroughput: 350
          - type: token-load-scorer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer

  modelServers:
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
