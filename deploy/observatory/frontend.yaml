apiVersion: v1
kind: ServiceAccount
metadata:
  name: observatory-frontend
  namespace: llm-d-observatory
  labels:
    app.kubernetes.io/name: observatory-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observatory-frontend
  namespace: llm-d-observatory
  labels:
    app.kubernetes.io/name: observatory-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observatory-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observatory-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: observatory-frontend
      nodeSelector:
        role: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: us-west4-docker.pkg.dev/your-gcp-project-id/llm-d-observatory/observatory-frontend:v0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: observatory-frontend
  namespace: llm-d-observatory
  labels:
    app.kubernetes.io/name: observatory-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: observatory-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
