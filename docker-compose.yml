services:
  observer-api:
    build:
      context: ./backend/observer
      dockerfile: Dockerfile
    environment:
      OBSERVER_LISTEN_ADDR: ":8080"
      OBSERVER_MOCK_MODE: "true"
      OBSERVER_REDACT_PROMPTS: "true"
      OBSERVER_ROUTER_MODE: "optimized-baseline"
      OBSERVER_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088"
    ports:
      - "8080:8080"
    read_only: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    depends_on:
      - observer-api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
